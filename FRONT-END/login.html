<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Boi Ralado</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">

      <!-- LADO ESQUERDO -->
      <div class="login-card__side">
        <div class="login-card__brand">
          <img src="img/logo.png" alt="Logo Boi Ralado" />
          <div>
            <div class="login-card__brand-title">Boi Ralado</div>
            <div class="login-card__brand-sub">Restaurante</div>
          </div>
        </div>

        <div class="login-card__quote">
          Sabor que <span>conquista</span>,<br />
          gestão que <span>funciona</span>.
        </div>

        <div class="login-card__foot">
          <i class="fa-solid fa-fire"></i> Sistema de Gestão Interna — v1.0 © 2026
        </div>
      </div>

      <!-- LADO DIREITO — FORMULÁRIO -->
      <div class="login-card__form">
        <div class="login-card__form-head">
          <h1>Acesse sua conta</h1>
          <p>Entre com suas credenciais de funcionário para continuar.</p>
        </div>

        <form class="login-form" id="loginForm" autocomplete="off">

          <div class="login-form__error" id="loginError">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>Usuário ou senha inválidos. Tente novamente.</span>
          </div>

          <div class="form-group">
            <label>Usuário ou E-mail</label>
            <div class="input-wrap">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="loginUser" placeholder="joao.silva" value="joao.silva" />
            </div>
          </div>

          <div class="form-group">
            <label>Senha</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="loginPass" placeholder="Digite sua senha" />
              <button type="button" class="toggle-pass" id="togglePass" title="Mostrar/ocultar senha">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="login-form__row">
            <label class="login-form__remember">
              <input type="checkbox" checked /> Manter conectado
            </label>
            <a href="#" class="login-form__forgot">Esqueci minha senha</a>
          </div>

          <button type="submit" class="login-form__submit">
            <i class="fa-solid fa-right-to-bracket"></i> Entrar
          </button>

          <div class="login-form__divider">ou</div>

          <a href="index.html" class="btn btn--outline" style="justify-content:center;">
            <i class="fa-solid fa-house"></i> Continuar sem login (Demo)
          </a>
        </form>

        <a href="index.html" class="login-card__back">
          <i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard
        </a>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const togglePass = document.getElementById('togglePass');
    const passInput = document.getElementById('loginPass');

    togglePass.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      togglePass.innerHTML = isPass
        ? '<i class="fa-solid fa-eye-slash"></i>'
        : '<i class="fa-solid fa-eye"></i>';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = passInput.value.trim();

      if (user.length === 0 || pass.length === 0) {
        errorBox.querySelector('span').textContent = 'Preencha usuário e senha para continuar.';
        errorBox.classList.add('show');
        return;
      }

      // Simulação de autenticação — substituir pela chamada real ao backend.
      errorBox.classList.remove('show');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
